name: Build W1NDY CFG

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md"]

permissions:
  contents: write

env:
  CORE_REF: v1.14.3
  GO_VERSION: 1.26.8

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  libbox:
    name: Core library (${{ matrix.go_arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        go_arch: [arm64, arm, amd64]
    steps:
      - name: Checkout core
        uses: actions/checkout@v5
        with:
          repository: SagerNet/sing-box
          ref: ${{ env.CORE_REF }}
          fetch-depth: 1
          fetch-tags: true
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ env.CORE_REF }}-${{ hashFiles('go.sum') }}
          restore-keys: go-mod-
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build library
        run: |
          git tag -f ${{ env.CORE_REF }}
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          go run ./cmd/internal/build_libbox -target android -platform android/${{ matrix.go_arch }}
          mkdir -p dist/${{ matrix.go_arch }}
          mv libbox.aar dist/${{ matrix.go_arch }}/
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      - name: Upload library
        uses: actions/upload-artifact@v4
        with:
          name: libbox-${{ matrix.go_arch }}
          path: dist
          compression-level: 0
          retention-days: 3

  app:
    name: APK
    runs-on: ubuntu-latest
    needs: libbox
    steps:
      - name: Checkout app
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Checkout core (merge tool)
        uses: actions/checkout@v5
        with:
          repository: SagerNet/sing-box
          ref: ${{ env.CORE_REF }}
          path: .core
          fetch-depth: 1
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Download libraries
        uses: actions/download-artifact@v4
        with:
          pattern: libbox-*
          path: libbox-inputs
          merge-multiple: true
      - name: Merge libraries
        run: |
          cd .core
          go run ./cmd/internal/merge_aar -output ../libbox.aar $(ls -d ../libbox-inputs/*/libbox.aar)
          cd ..
          mkdir -p app/libs
          cp libbox.aar app/libs/
          # legacy flavor is not built, but Gradle resolves its file dependency
          cp libbox.aar app/libs/libbox-legacy.aar
          ls -la app/libs
      - name: Signing key
        run: |
          if [ -z "${{ secrets.KEYSTORE_B64 }}" ]; then echo "KEYSTORE_B64 secret is missing"; exit 1; fi
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > app/release.keystore
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: ./gradlew --no-daemon :app:assembleOtherRelease
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
      - name: Prepare files
        run: |
          rm -f app/release.keystore
          mkdir -p dist
          cp app/build/outputs/apk/other/release/*.apk dist/
          VERSION_CODE=$(grep VERSION_CODE version.properties | cut -d= -f2)
          VERSION_NAME=$(grep VERSION_NAME version.properties | cut -d= -f2)
          printf '{\n  "version_code": %s,\n  "version_name": "%s"\n}\n' "$VERSION_CODE" "$VERSION_NAME" > dist/SFA-version-metadata.json
          cd dist && sha256sum *.apk > SHA256SUMS.txt && ls -la
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: W1NDY-CFG-apk
          path: dist
          retention-days: 30
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* --title "W1NDY CFG ${GITHUB_REF_NAME}" \
            --notes "Сборка ${GITHUB_REF_NAME}. Основано на sing-box ${CORE_REF} (GPL-3.0)." || \
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber

  smoke:
    name: Emulator check
    runs-on: ubuntu-latest
    needs: app
    timeout-minutes: 30
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: W1NDY-CFG-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash -c "$SMOKE"
        env:
          SMOKE: |
            set -x
            mkdir -p shots
            adb install -r apk/*-x86_64.apk
            adb logcat -c
            adb shell monkey -p com.w1ndy.cfg -c android.intent.category.LAUNCHER 1
            sleep 20
            adb exec-out screencap -p > shots/1-main.png
            # нажимаем "У меня есть ссылка"
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1; adb pull /sdcard/ui.xml shots/ui-main.xml || true
            XY=$(python3 -c "import re,sys; s=open('shots/ui-main.xml',encoding='utf-8').read(); m=re.search(r'text=\"У меня есть ссылка\"[^>]*bounds=\"\[(\d+),(\d+)\]\[(\d+),(\d+)\]\"', s); print('' if not m else f'{(int(m[1])+int(m[3]))//2} {(int(m[2])+int(m[4]))//2}')" 2>/dev/null)
            if [ -n "$XY" ]; then adb shell input tap $XY; sleep 3; adb exec-out screencap -p > shots/2-link-dialog.png; adb shell input keyevent 4; sleep 2; fi
            adb shell pidof com.w1ndy.cfg && echo "APP_ALIVE=1" | tee shots/status.txt || echo "APP_ALIVE=0" | tee shots/status.txt
            adb logcat -d -b crash > shots/crash.txt || true
            adb logcat -d | grep -iE "AndroidRuntime|FATAL|w1ndy" | tail -200 > shots/logcat.txt || true
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-shots
          path: shots
          retention-days: 14
